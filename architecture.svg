<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Portal shared tile storage architecture">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arwDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#0d1117"/>
  <text x="500" y="36" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Portal — shared tile storage architecture</text>

  <!-- BROWSER -->
  <rect x="40" y="64" width="220" height="240" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="150" y="92" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">🌐 ANY BROWSER / DEVICE</text>
  <text x="150" y="112" fill="#8b949e" font-size="11" text-anchor="middle">GitHub Pages site (static, public)</text>
  <line x1="56" y1="124" x2="244" y2="124" stroke="#30363d"/>
  <text x="56" y="148" fill="#e6edf3" font-size="11.5">index.html — login + grid</text>
  <text x="56" y="168" fill="#e6edf3" font-size="11.5">app.js — portal logic</text>
  <text x="56" y="188" fill="#e6edf3" font-size="11.5">shared.js — knows worker URL</text>
  <text x="56" y="208" fill="#e6edf3" font-size="11.5">tilemanager.html — admin</text>
  <line x1="56" y1="222" x2="244" y2="222" stroke="#30363d"/>
  <text x="56" y="244" fill="#8b949e" font-size="11">Per-browser (localStorage):</text>
  <text x="56" y="262" fill="#8b949e" font-size="11">· zoom slider</text>
  <text x="56" y="280" fill="#8b949e" font-size="11">· admin password override</text>

  <!-- WORKER -->
  <rect x="400" y="64" width="280" height="240" rx="12" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
  <text x="540" y="92" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">⚡ CLOUDFLARE WORKER</text>
  <text x="540" y="112" fill="#8b949e" font-size="11" text-anchor="middle">portal-tiles.&lt;your-account&gt;.workers.dev</text>
  <line x1="416" y1="124" x2="664" y2="124" stroke="#30363d"/>
  <text x="416" y="148" fill="#e6edf3" font-size="11.5">GET /tiles — public read</text>
  <text x="416" y="168" fill="#e6edf3" font-size="11.5">PUT /tiles — admin password</text>
  <text x="416" y="188" fill="#e6edf3" font-size="11.5">POST /tiles/order — reorder</text>
  <line x1="416" y1="204" x2="664" y2="204" stroke="#30363d"/>
  <text x="416" y="228" fill="#3fb950" font-size="11.5" font-weight="600">🔒 Secret: EDIT_PASSWORD_HASH</text>
  <text x="416" y="246" fill="#3fb950" font-size="11">(SHA-256 of admin password —</text>
  <text x="416" y="262" fill="#3fb950" font-size="11">encrypted on Cloudflare; never in</text>
  <text x="416" y="278" fill="#3fb950" font-size="11">the repo, never sent to browsers)</text>

  <!-- KV -->
  <rect x="780" y="64" width="180" height="240" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="870" y="92" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">🗄️ WORKERS KV</text>
  <text x="870" y="112" fill="#8b949e" font-size="11" text-anchor="middle"><kv-namespace-name></text>
  <line x1="796" y1="124" x2="944" y2="124" stroke="#30363d"/>
  <text x="796" y="148" fill="#e6edf3" font-size="11.5">key: "tiles"</text>
  <text x="796" y="168" fill="#e6edf3" font-size="11.5">value: JSON array</text>
  <text x="796" y="184" fill="#e6edf3" font-size="11.5">of every tile</text>
  <line x1="796" y1="204" x2="944" y2="204" stroke="#30363d"/>
  <text x="870" y="228" fill="#3fb950" font-size="11" font-weight="600" text-anchor="middle">Shared source of truth:</text>
  <text x="870" y="246" fill="#3fb950" font-size="11" text-anchor="middle">same tiles on every</text>
  <text x="870" y="262" fill="#3fb950" font-size="11" text-anchor="middle">device, instantly</text>

  <!-- BROWSER -> WORKER arrows -->
  <text x="330" y="94" fill="#58a6ff" font-size="10.5" text-anchor="middle">GET /tiles</text>
  <line x1="266" y1="100" x2="394" y2="100" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="394" y1="118" x2="266" y2="118" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arwDim)"/>
  <text x="330" y="132" fill="#8b949e" font-size="10.5" text-anchor="middle">tiles JSON (everyone)</text>

  <text x="330" y="154" fill="#58a6ff" font-size="10.5" text-anchor="middle">PUT /tiles + password</text>
  <line x1="266" y1="160" x2="394" y2="160" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="394" y1="178" x2="266" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arwDim)"/>
  <text x="330" y="192" fill="#8b949e" font-size="10.5" text-anchor="middle">{saved: n}</text>

  <text x="330" y="214" fill="#58a6ff" font-size="10.5" text-anchor="middle">POST /tiles/order</text>
  <line x1="266" y1="220" x2="394" y2="220" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="394" y1="238" x2="266" y2="238" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arwDim)"/>
  <text x="330" y="252" fill="#8b949e" font-size="10.5" text-anchor="middle">{moved:true}</text>

  <!-- WORKER -> KV arrows -->
  <text x="730" y="103" fill="#8b949e" font-size="10.5" text-anchor="middle">read</text>
  <line x1="686" y1="109" x2="774" y2="109" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arwDim)"/>
  <text x="730" y="163" fill="#8b949e" font-size="10.5" text-anchor="middle">write</text>
  <line x1="686" y1="169" x2="774" y2="169" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arwDim)"/>
  <text x="730" y="223" fill="#8b949e" font-size="10.5" text-anchor="middle">read + rewrite</text>
  <line x1="686" y1="229" x2="774" y2="229" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arwDim)"/>

  <!-- FALLBACK -->
  <path d="M 150 304 C 150 370, 250 440, 372 440" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwDim)"/>
  <rect x="380" y="396" width="320" height="84" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="540" y="424" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="middle">If the worker is unreachable:</text>
  <text x="540" y="444" fill="#8b949e" font-size="11.5" text-anchor="middle">the page falls back to localStorage</text>
  <text x="540" y="462" fill="#8b949e" font-size="11.5" text-anchor="middle">(per-browser tiles — the site never breaks)</text>

  <!-- NOTES -->
  <text x="40" y="530" fill="#e6edf3" font-size="14" font-weight="700">How it works</text>
  <text x="40" y="556" fill="#8b949e" font-size="12">1  Every visitor's page runs GET /tiles — everyone sees the same tiles on every device</text>
  <text x="40" y="576" fill="#8b949e" font-size="12">2  Admin panel signs PUT /tiles with an X-Portal-Password header; the worker verifies the SHA-256</text>
  <text x="54" y="592" fill="#8b949e" font-size="12">against its secret, then writes the tile list to KV</text>
  <text x="40" y="612" fill="#8b949e" font-size="12">3  Reordering sends POST /tiles/order with tile ids in the new order; the worker validates it,</text>
  <text x="54" y="628" fill="#8b949e" font-size="12">then re-saves — so the layout is shared too</text>
  <text x="40" y="648" fill="#8b949e" font-size="12">4  A brand-new visitor or device gets the shared tiles immediately — no setup needed</text>
  <text x="40" y="676" fill="#484f58" font-size="11">Frontend: GitHub Pages (static)   ·   Backend: Cloudflare Workers + KV (free tier)   ·   Admin gate: enforced server-side</text>
</svg>